<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حسابي | ويكند جو</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ==================== RESET & BASE ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:       #0B1325;
      --navy-mid:   #0D1B2A;
      --cyan:       #00E5FF;
      --green:      #A6CE39;
      --white:      #FFFFFF;
      --silver:     #8D99AE;
      --glass-bg:   rgba(11,19,37,0.55);
      --glass-border: rgba(255,255,255,0.12);
      --font:       'Cairo', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body.light-mode {
      --navy: #FFFFFF;
      --navy-mid: #F8FAFC;
      --white: #0B1325;
      --silver: #64748B;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.05);
      background: var(--navy);
      color: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .glass { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }
    .btn-primary { background: linear-gradient(135deg, var(--green), #7ab22e); color: #0B1325; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }

    /* ==================== NAVBAR ==================== */
    .navbar {
      background: rgba(11,19,37,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    body.light-mode .navbar { background: rgba(255,255,255,0.95); }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; }
    .nav-logo .go-badge { background: var(--green); color: #0B1F63; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; margin-right: 4px; }
    
    /* ==================== PROFILE ==================== */
    .profile-container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      width: 100%;
      flex: 1;
    }
    .profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--cyan); object-fit: cover; }
    .profile-info h1 { font-size: 32px; margin-bottom: 8px; }
    .profile-info p { color: var(--silver); font-size: 16px; }
    
    .profile-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 768px) { .profile-grid { grid-template-columns: 1fr; } }
    
    .sidebar { border-radius: 12px; padding: 20px; }
    .sidebar-menu { list-style: none; }
    .sidebar-menu li { padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 600; color: var(--silver); }
    .sidebar-menu li:hover, .sidebar-menu li.active { background: rgba(0,229,255,0.1); color: var(--cyan); }
    
    .content-area { border-radius: 12px; padding: 32px; }
    .content-title { font-size: 24px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--glass-border); }
    
    .empty-state { text-align: center; padding: 40px; color: var(--silver); }
    
    .logout-form { margin-top: 24px; }
    .btn-danger { background: rgba(220,50,50,0.1); color: #f09595; border: 1px solid rgba(220,50,50,0.3); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; text-align: right; }
    .btn-danger:hover { background: rgba(220,50,50,0.2); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="nav-logo">ويكند <span class="go-badge">جو</span></a>
    <div>
      <button class="btn-primary" onclick="window.location.href='/'">الرئيسية</button>
    </div>
  </nav>

  <div class="profile-container" id="loading-state">
    <div style="text-align:center; padding: 60px;">جاري تحميل البيانات...</div>
  </div>

  <div class="profile-container" id="error-state" style="display:none;">
    <div class="glass" style="padding:40px; text-align:center; border-radius:12px;">
      <h2 style="margin-bottom:16px;">يرجى تسجيل الدخول أولاً</h2>
      <button class="btn-primary" onclick="window.location.href='/auth/google'">تسجيل الدخول باستخدام Google</button>
    </div>
  </div>

  <div class="profile-container" id="profile-content" style="display:none;">
    <div class="profile-header">
      <img id="user-avatar" src="" alt="Avatar" class="profile-avatar" />
      <div class="profile-info">
        <h1 id="user-name">الاسم</h1>
        <p id="user-email">البريد الإلكتروني</p>
      </div>
    </div>

    <div class="profile-grid">
      <div class="sidebar glass">
        <ul class="sidebar-menu">
          <li class="active">الملف الشخصي</li>
          <li>حجوزاتي</li>
          <li>المفضلة</li>
          <li>الإعدادات</li>
        </ul>
        <form action="/auth/logout" method="POST" class="logout-form">
          <button type="submit" class="btn-danger">تسجيل الخروج</button>
        </form>
      </div>
      
      <div class="content-area glass">
        <h2 class="content-title">حجوزاتي الأخيرة</h2>
        <div class="empty-state">
          <div style="font-size:40px; margin-bottom:16px;">✈️</div>
          <p>لا توجد حجوزات سابقة. ابدأ بالتخطيط لرحلتك القادمة الآن!</p>
          <button class="btn-primary" style="margin-top:20px;" onclick="window.location.href='/'">تصفح العروض</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
    }

    fetch('/api/user')
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading-state').style.display = 'none';
        if (data.loggedIn) {
          document.getElementById('profile-content').style.display = 'block';
          document.getElementById('user-name').textContent = data.user.name;
          document.getElementById('user-email').textContent = data.user.email;
          if (data.user.avatar) {
            document.getElementById('user-avatar').src = data.user.avatar;
          } else {
            document.getElementById('user-avatar').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.user.name) + '&background=00E5FF&color=0B1325';
          }
        } else {
          document.getElementById('error-state').style.display = 'block';
        }
      })
      .catch(err => {
        document.getElementById('loading-state').innerHTML = '<p>حدث خطأ في جلب البيانات.</p>';
      });
  </script>
</body>
</html>
